name: "Flutter Mobile Pull Request Checks"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-mobile-ci.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional backend API base URL passed via --dart-define=CHURCH_API_BASE_URL"
        required: false
        default: ""
        type: string

concurrency:
  group: flutter-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  android-apk:
    name: Build Android APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -n "${API_BASE_URL}" ]; then
            flutter build apk --release "--dart-define=CHURCH_API_BASE_URL=${API_BASE_URL}"
          else
            flutter build apk --release
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: church-digital-platform-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
