name: "Update stale pull request branches"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  update-branches:
    name: Update open PRs behind main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Explain missing update token
        if: ${{ secrets.PR_BRANCH_UPDATE_TOKEN == '' }}
        run: |
          echo "::warning::Add the repository secret PR_BRANCH_UPDATE_TOKEN to enable automatic branch updates. Run this workflow again after adding it."

      - name: Update stale same-repository pull requests
        if: ${{ secrets.PR_BRANCH_UPDATE_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN }}
          script: |
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            for (const candidate of pullRequests) {
              if (candidate.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
                core.info(`Skipping PR #${candidate.number}: its branch is in a fork.`);
                continue;
              }

              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number
              });

              if (pull.merged || pull.state !== 'open' || pull.mergeable_state !== 'behind') {
                core.info(`Skipping PR #${pull.number}: merge state is ${pull.mergeable_state}.`);
                continue;
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pull.number
                });
                core.info(`Requested an update for PR #${pull.number}; GitHub Actions checks will run on the updated branch.`);
              } catch (error) {
                core.warning(`Could not update PR #${pull.number}: ${error.message}`);
              }
            }
