name: Delivery coordinator
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only; do not dispatch"
        type: boolean
        default: true
  issues:
    types: [closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [closed, opened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: delivery-coordinator
  cancel-in-progress: false
jobs:
  coordinate:
    if: github.event_name != 'issue_comment' || github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Plan and request eligible work
        uses: actions/github-script@v7
        env:
          COORDINATOR_TOKEN: ${{ secrets.PR_BRANCH_UPDATE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN || github.token }}
          script: |
            const {run}=require(process.cwd()+'/.github/delivery/run.cjs');
            const dryRun=process.env.DRY_RUN==='true';
            if (!dryRun && !process.env.COORDINATOR_TOKEN) throw new Error('Owner dispatch token missing; no work dispatched');
            const client=github;
            await run({github:client,context,core,dryRun});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-status
          path: delivery-report/status.json
          if-no-files-found: ignore
