name: "Orchestrator: Auto-Merge Passing PRs"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge after successful tests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const labelsToEnsure = [
              { name: 'auto-merge-queued', color: '1D76DB', description: 'Auto-merge requested after passing CI' },
              { name: 'jules-dispatched', color: '5319E7', description: 'Next sequential issue was dispatched to Jules' }
            ];

            for (const label of labelsToEnsure) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            for (const pull of openPulls) {
              if (pull.draft || pull.head.repo?.full_name !== `${owner}/${repo}`) continue;

              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pull.head.sha,
                per_page: 100
              });
              const testCheckPassed = data.check_runs.some(check =>
                check.name === '.NET 10 unit tests' &&
                check.status === 'completed' &&
                check.conclusion === 'success'
              );
              const checksAllGreen = data.check_runs.length > 0 && data.check_runs.every(check =>
                check.status === 'completed' &&
                ['success', 'neutral', 'skipped'].includes(check.conclusion)
              );

              if (!testCheckPassed || !checksAllGreen) {
                core.info(`Skipping PR #${pull.number}; required .NET tests or another check is not green yet.`);
                continue;
              }

              try {
                if (!pull.auto_merge) {
                  await github.graphql(`
                    mutation EnableAutoMerge($pullRequestId: ID!) {
                      enablePullRequestAutoMerge(input: {
                        pullRequestId: $pullRequestId,
                        mergeMethod: SQUASH
                      }) {
                        pullRequest { number }
                      }
                    }
                  `, { pullRequestId: pull.node_id });
                  core.info(`Enabled squash auto-merge for PR #${pull.number}.`);
                } else {
                  core.info(`Auto-merge is already enabled for PR #${pull.number}.`);
                }

                const currentLabels = pull.labels.map(label => label.name);
                if (!currentLabels.includes('auto-merge-queued')) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pull.number,
                    labels: ['auto-merge-queued']
                  });
                }
              } catch (error) {
                core.warning(`Could not enable auto-merge for PR #${pull.number}: ${error.message}`);
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: 'main',
              per_page: 100
            });

            const readyToDispatch = closedPulls.filter(pull =>
              pull.merged_at &&
              pull.labels.some(label => label.name === 'auto-merge-queued') &&
              !pull.labels.some(label => label.name === 'jules-dispatched')
            );

            for (const pull of readyToDispatch) {
              const references = [
                ...`${pull.title}\n${pull.body || ''}`.matchAll(/(?:issue|pbi|closes|fixes|resolves)\s*#(\d+)/gi)
              ].map(match => Number(match[1]));
              const completedIssue = references.length ? Math.max(...references) : 0;

              const nextIssue = openIssues
                .filter(issue =>
                  !issue.pull_request &&
                  issue.number > completedIssue &&
                  !issue.labels.some(label => label.name.toLowerCase() === 'jules')
                )
                .sort((a, b) => a.number - b.number)[0];

              if (nextIssue) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: nextIssue.number,
                  labels: ['jules']
                });
                core.info(`Applied the jules label to Issue #${nextIssue.number} after PR #${pull.number} merged.`);
                nextIssue.labels = [...nextIssue.labels, { name: 'jules' }];
              } else {
                core.info(`No open sequential issue follows Issue #${completedIssue} for PR #${pull.number}.`);
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull.number,
                labels: ['jules-dispatched']
              });
            }
