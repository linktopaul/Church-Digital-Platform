name: Antigravity Issue Dispatch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to dispatch to Antigravity CLI"
        required: true
        type: number

permissions: {}

concurrency:
  group: antigravity-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'antigravity' &&
       github.event.sender.login == github.repository_owner &&
       !github.event.issue.pull_request &&
       github.event.issue.state == 'open') ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, antigravity]
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Prepare issue context and verify eligibility
        id: prep
        uses: actions/github-script@v7
        env:
          TARGET_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          github-token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN || github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.TARGET_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(`Invalid issue number: ${process.env.TARGET_ISSUE_NUMBER}`);
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            if (issue.state !== 'open' || issue.pull_request) {
              core.info(`Issue #${issueNumber} is closed or a pull request; skipping.`);
              core.setOutput('should_run', 'false');
              return;
            }

            const baseBranch = `antigravity/issue-${issueNumber}`;
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });
            const existingPr = openPulls.find(p =>
              p.head?.ref === baseBranch ||
              (p.head?.ref || '').startsWith(`${baseBranch}-`)
            );
            if (existingPr) {
              core.info(`Open PR #${existingPr.number} already exists for #${issueNumber}; skipping duplicate dispatch.`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Antigravity dispatch skipped: open PR #${existingPr.number} (\`${existingPr.head.ref}\`) already tracks this issue.`
              });
              core.setOutput('should_run', 'false');
              return;
            }

            let branch = baseBranch;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${baseBranch}`
              });
              branch = `${baseBranch}-r${context.runNumber}`;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const recentComments = comments
              .slice(-10)
              .map(c => `- @${c.user?.login || 'unknown'} (${c.created_at}):\n${c.body || ''}`)
              .join('\n\n');

            const prompt = [
              `You are working in ${owner}/${repo} on GitHub Issue #${issueNumber}: ${issue.title}`,
              '',
              'Follow AGENTS.md in the repository root strictly (including tenant isolation, privacy boundaries, and ownership splits).',
              'If the issue divides work across agents or specifies an exclusive file ownership list, touch ONLY the files assigned to Antigravity and leave other files untouched.',
              'Before finishing, run applicable verification locally (for mobile changes: `cd mobile && flutter analyze --fatal-infos && flutter test`; for backend changes: `dotnet test` on the relevant test project).',
              'Do NOT run git commit, git push, or create a pull request yourself; leave your validated changes in the working tree on the checked-out branch so the workflow can commit, push, and open the PR.',
              '',
              '## Issue Body',
              issue.body || '(empty)',
              '',
              '## Recent Issue Comments',
              recentComments || '(none)'
            ].join('\n');

            const runnerTemp = process.env.RUNNER_TEMP || '/tmp';
            fs.writeFileSync(path.join(runnerTemp, 'antigravity_prompt.txt'), prompt, 'utf8');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `Antigravity CLI (\`PaulAI-antigravity\`) picked up #${issueNumber} on branch \`${branch}\`. A pull request or status update will be posted here when the run completes.`
            });

            core.setOutput('should_run', 'true');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issue.title);
            core.setOutput('branch', branch);

      - name: Check out main branch
        if: steps.prep.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN || github.token }}

      - name: Set up .NET 10
        if: steps.prep.outputs.should_run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Execute Antigravity CLI and push branch if changed
        id: agy
        if: steps.prep.outputs.should_run == 'true'
        shell: bash
        env:
          HOME: /home/m25c1233.paul
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.prep.outputs.issue_title }}
          WORK_BRANCH: ${{ steps.prep.outputs.branch }}
        run: |
          set -euo pipefail
          export PATH="/home/m25c1233.paul/.local/bin:/home/m25c1233.paul/flutter/bin:$PATH"

          git checkout -B "$WORK_BRANCH"
          PROMPT="$(cat "$RUNNER_TEMP/antigravity_prompt.txt")"

          set +e
          agy -p "$PROMPT" --mode accept-edits --dangerously-skip-permissions --print-timeout 35m --output-format text | tee "$RUNNER_TEMP/antigravity_output.txt"
          AGY_EXIT=${PIPESTATUS[0]}
          set -e

          echo "agy_exit=$AGY_EXIT" >> "$GITHUB_OUTPUT"

          HAS_UNCOMMITTED=false
          if [ -n "$(git status --porcelain)" ]; then
            HAS_UNCOMMITTED=true
          fi
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD)

          if [ "$HAS_UNCOMMITTED" = "true" ] || [ "$COMMITS_AHEAD" -gt 0 ]; then
            if [ "$HAS_UNCOMMITTED" = "true" ]; then
              git config user.name "${GITHUB_REPOSITORY_OWNER}"
              git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"
              git add -A
              git commit -m "Implement #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            fi
            git push -u origin "$WORK_BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request or report status on issue
        if: always() && steps.prep.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.prep.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.prep.outputs.issue_title }}
          WORK_BRANCH: ${{ steps.prep.outputs.branch }}
          HAS_CHANGES: ${{ steps.agy.outputs.has_changes }}
          AGY_EXIT: ${{ steps.agy.outputs.agy_exit }}
        with:
          github-token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN || github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueTitle = process.env.ISSUE_TITLE || '';
            const branch = process.env.WORK_BRANCH;
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const agyExit = process.env.AGY_EXIT || 'unknown';

            const runnerTemp = process.env.RUNNER_TEMP || '/tmp';
            const outPath = path.join(runnerTemp, 'antigravity_output.txt');
            const rawOutput = fs.existsSync(outPath) ? fs.readFileSync(outPath, 'utf8').trim() : '';
            const summary = rawOutput.length > 6000
              ? `${rawOutput.slice(0, 6000)}\n\n...(truncated)...`
              : (rawOutput || '(no output captured)');

            if (hasChanges) {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `feat: #${issueNumber} ${issueTitle}`.slice(0, 240),
                head: branch,
                base: 'main',
                body: [
                  `Automated Antigravity CLI run for #${issueNumber}.`,
                  '',
                  `Refs #${issueNumber}`,
                  '',
                  '## Antigravity Output',
                  summary
                ].join('\n')
              });

              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['in-progress']
                });
              } catch (error) {
                core.warning(`Could not add in-progress label: ${error.message}`);
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Antigravity CLI opened PR #${pr.number} (${pr.html_url}) from \`${branch}\` (exit code ${agyExit}).\n\n<details>\n<summary>Run summary</summary>\n\n${summary}\n\n</details>`
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Antigravity CLI finished on #${issueNumber} with exit code ${agyExit} and no file changes committed.\n\n<details>\n<summary>Output</summary>\n\n${summary}\n\n</details>`
              });
            }

            if (agyExit !== '0') {
              core.setFailed(`Antigravity CLI exited with code ${agyExit}`);
            }
