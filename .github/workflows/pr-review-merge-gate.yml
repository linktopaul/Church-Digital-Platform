name: Current head review merge gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pr-review-merge-gate.yml']
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["Orchestrator: Test, Auto-Merge & Dispatch Next Issue", "Flutter Mobile Pull Request Checks"]
    types: [completed]
permissions: {}
concurrency:
  group: current-head-review-merge-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branchRules=await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}',{owner,repo,branch:'main'});
            const nativeGateRequired=branchRules.data.some(r=>r.type==='required_status_checks' && r.parameters.required_status_checks.some(c=>c.context==='Review acceptance'));
            const pulls=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',base:'main',per_page:100});
            for (const candidate of pulls) {
              if (candidate.head.repo?.full_name !== owner+'/'+repo) continue;
              const {data:pull}=await github.rest.pulls.get({owner,repo,pull_number:candidate.number});
              const reasons=[];
              if (pull.draft) reasons.push('draft');
              const query=await github.graphql(`query($owner:String!,$repo:String!,$number:Int!) {
                repository(owner:$owner,name:$repo) { pullRequest(number:$number) {
                  reviewThreads(first:100) { nodes { isResolved } pageInfo { hasNextPage } }
                  reviews(first:100) { nodes { state author { login __typename } commit { oid } } pageInfo { hasNextPage } }
                } }
              }`,{owner,repo,number:pull.number});
              const review=query.repository.pullRequest;
              if (review.reviewThreads.pageInfo.hasNextPage || review.reviews.pageInfo.hasNextPage) reasons.push('review history exceeds bounded inspection');
              if (review.reviewThreads.nodes.some(t=>!t.isResolved)) reasons.push('unresolved review threads');
              const latest=new Map();
              for (const r of review.reviews.nodes) if (r.author && r.state!=='COMMENTED' && r.state!=='PENDING') latest.set(r.author.login,r);
              if ([...latest.values()].some(r=>r.state==='CHANGES_REQUESTED')) reasons.push('changes requested');
              const humanApproved=[...latest.values()].some(r=>r.state==='APPROVED' && r.author.__typename==='User' && r.author.login!==pull.user.login && r.commit?.oid===pull.head.sha);
              const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pull.number,per_page:100});
              const cleanCodex=comments.some(c=>{
                if (c.user.login!=='chatgpt-codex-connector[bot]') return false;
                const match=(c.body||'').match(/<!-- codex-review-state:v1 ([\s\S]*?) -->/);
                if (!match) return false;
                try {
                  const r=JSON.parse(match[1]).code_review;
                  return r?.commit_sha===pull.head.sha && r.status==='completed' && r.has_unresolved_findings===false;
                } catch { return false; }
              });
              if (!humanApproved && !cleanCodex) reasons.push('no clean current-head review');
              const checks=await github.paginate(github.rest.checks.listForRef,{owner,repo,ref:pull.head.sha,per_page:100});
              for (const name of ['.NET 10 unit tests','Flutter mobile checks']) {
                const matches=checks.filter(c=>c.name===name && c.app?.slug==='github-actions').sort((a,b)=>b.id-a.id);
                if (!matches.length || matches[0].status!=='completed' || matches[0].conclusion!=='success') reasons.push(name+' not passed');
              }
              if (checks.some(c=>c.name!=='Review acceptance' && ['failure','timed_out','action_required','cancelled'].includes(c.conclusion))) reasons.push('other unsuccessful checks');
              const fresh=(await github.rest.pulls.get({owner,repo,pull_number:pull.number})).data;
              if (fresh.head.sha!==pull.head.sha) reasons.push('head changed during inspection');
              if (fresh.state!=='open' || fresh.merged) continue;
              const priorGate=checks.filter(c=>c.name==='Review acceptance' && c.app?.slug==='github-actions').sort((a,b)=>b.id-a.id)[0];
              const gateResult={owner,repo,name:'Review acceptance',head_sha:pull.head.sha,status:'completed',conclusion:reasons.length?'action_required':'success',output:{title:reasons.length?'Review acceptance not met':'Current head review accepted',summary:reasons.length?reasons.join('; '):'Passing CI and clean current-head review with no unresolved findings.'}};
              if (priorGate) {
                const {head_sha,...update}=gateResult;
                await github.rest.checks.update({...update,check_run_id:priorGate.id});
              } else await github.rest.checks.create(gateResult);
              if (!nativeGateRequired) reasons.push('main must require Review acceptance before auto-merge is enabled');
              if (reasons.length) {
                if (fresh.auto_merge) await github.graphql('mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}',{id:pull.node_id});
                core.info('PR #'+pull.number+' held: '+reasons.join('; '));
                continue;
              }
              if (!fresh.auto_merge) await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}',{id:pull.node_id});
              core.info('PR #'+pull.number+' passed review gate; native repository rules still apply.');
            }
