name: MVP Cloud Supervisor
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: mvp-cloud-supervisor
  cancel-in-progress: false
jobs:
  supervise:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    steps:
      - name: Inspect current PRs and reconcile project status
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            for (const workflow_id of ['update-stale-pr-branches.yml', 'pbi-status-sync.yml']) {
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id, ref:'main'});
            }
            const pulls = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',base:'main',per_page:100});
            const actions = [];
            for (const candidate of pulls) {
              if (candidate.draft || candidate.head.repo?.full_name !== owner + '/' + repo) continue;
              const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:candidate.number});
              const {data:checks}=await github.rest.checks.listForRef({owner,repo,ref:pr.head.sha,per_page:100});
              const failures=checks.check_runs.filter(c=>['failure','timed_out','action_required'].includes(c.conclusion));
              const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pr.number,per_page:100});
              const marker='<!-- mvp-supervisor:'+pr.head.sha+' -->';
              const commits=await github.paginate(github.rest.pulls.listCommits,{owner,repo,pull_number:pr.number,per_page:100});
              const latest=commits[commits.length-1];
              const recentlyAsked=comments.some(c=>c.body.includes('@codex review') && Date.now()-Date.parse(c.created_at)<3600000);
              // Implementation feedback is owned by delivery-coordinator.yml.
              const reviewMarker='<!-- mvp-supervisor-review:'+pr.head.sha+' -->';
              if (latest?.parents?.length===1 && !recentlyAsked && !comments.some(c=>c.body.includes(reviewMarker))) {
                actions.push({number:pr.number,body:reviewMarker+'\n@codex review\nPlease inspect correctness, tenant/privacy boundaries, acceptance criteria, and remaining findings on the current feature changes. Documentation-only deliverables must not close implementation parent PBIs.'});
              }
              await core.summary.addRaw('PR #'+pr.number+': '+(pr.mergeable===false?'conflict':failures.length?'check failure':'checks pending or healthy')+'\n');
            }
            core.setOutput('actions',JSON.stringify(actions));
            await core.summary.write();
      - name: Send actionable feedback using repository owner token
        uses: actions/github-script@v7
        env:
          SUPERVISOR_ACTIONS: ${{ steps.inspect.outputs.actions }}
        with:
          github-token: ${{ secrets.PR_BRANCH_UPDATE_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const actions=JSON.parse(process.env.SUPERVISOR_ACTIONS || '[]');
            for (const action of actions) {
              await github.rest.issues.createComment({owner,repo,issue_number:action.number,body:action.body});
            }
