name: "Orchestrator: Test, Auto-Merge & Dispatch Next Issue"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to test after an automatic base-branch update
        required: true
        type: number

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: .NET 10 unit tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit test projects
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET unit test projects were found."
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            echo "Testing ${project}"
            dotnet test "${project}" --configuration Release --verbosity normal
          done

