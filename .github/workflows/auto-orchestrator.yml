name: "Orchestrator: Test, Auto-Merge & Dispatch Next Issue"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to test after an automatic base-branch update
        required: true
        type: number

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: .NET 10 unit tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit test projects
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET unit test projects were found."
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            echo "Testing ${project}"
            dotnet test "${project}" --configuration Release --verbosity normal
          done

  enable-auto-merge:
    name: Enable auto-merge after tests pass
    needs: test
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number ??
              Number(context.payload.inputs?.pull_request_number);
            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              throw new Error('A valid pull_request_number is required.');
            }

            const { owner, repo } = context.repo;
            const sameRepository = `${owner}/${repo}`;
            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber
            });
            if (pull.state !== 'open' || pull.merged || pull.draft ||
                pull.head.repo?.full_name !== sameRepository) {
              core.info(`Skipping auto-merge for PR #${pullNumber}: it is not an open, ready, same-repository PR.`);
              return;
            }

            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `;
            try {
              await github.graphql(mutation, { pullRequestId: pull.node_id });
              core.info(`Auto-merge enabled successfully for PR #${pullNumber}.`);
            } catch (error) {
              core.warning(`GraphQL auto-merge failed: ${error.message}. Attempting direct squash merge.`);
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pullNumber, merge_method: 'squash'
                });
                core.info(`Direct squash merge succeeded for PR #${pullNumber}.`);
              } catch (mergeErr) {
                core.warning(`Direct squash merge also failed: ${mergeErr.message}`);
                throw error;
              }
            }
