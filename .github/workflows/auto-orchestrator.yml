name: "Orchestrator: Test, Auto-Merge & Dispatch Next Issue"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: .NET 10 unit tests
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit test projects
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET unit test projects were found."
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            echo "Testing ${project}"
            dotnet test "${project}" --configuration Release --verbosity normal
          done

  enable-auto-merge:
    name: Enable auto-merge after tests pass
    needs: test
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `;
            try {
              await github.graphql(mutation, {
                pullRequestId: context.payload.pull_request.node_id
              });
              core.info('Auto-merge enabled successfully via GraphQL.');
            } catch (error) {
              core.warning(`GraphQL auto-merge failed: ${error.message}. Attempting direct squash merge.`);
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  merge_method: 'squash'
                });
                core.info('Direct squash merge succeeded.');
              } catch (mergeErr) {
                core.warning(`Direct squash merge also failed: ${mergeErr.message}`);
                throw error;
              }
            }
